name: STRATUM Business UAT Once
on:
  push:
    branches: [main]
jobs:
  business-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TECH_TOKEN: eyJhbGciOiJIUzI1NiJ9.eyJ1c2VySWQiOiIyMDAwMDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwMDEiLCJlbWFpbCI6ImZpZWxkLnVhdEBzdHJhdHVtLmludmFsaWQiLCJvcmdhbml6YXRpb25JZCI6IjEwMDAwMDAwLTAwMDAtNDAwMC04MDAwLTAwMDAwMDAwMDAwMSIsInJvbGUiOiJURUNITklDSUFOIiwiaWF0IjoxNzg3NjEzODE1LCJleHAiOjE3ODc2MTQ3MTV9.b5xtyLfYKOzXwdReYtp1tO3Ll8YbLU6PqMLMuLzS1aE
      INSPECTOR_TOKEN: eyJhbGciOiJIUzI1NiJ9.eyJ1c2VySWQiOiIyMDAwMDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwMDIiLCJlbWFpbCI6Imluc3BlY3Rvci51YXRAc3RyYXR1bS5pbnZhbGlkIiwib3JnYW5pemF0aW9uSWQiOiIxMDAwMDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwMDEiLCJyb2xlIjoiSU5TUEVDVE9SIiwiaWF0IjoxNzg3NjEzODE1LCJleHAiOjE3ODc2MTQ3MTV9.r9EmwdEjApHHnrxjQhsQlEzJhazJXCuxKV1SgAkwud0
    steps:
      - name: Submit installation lifecycle event as technician
        run: |
          curl --fail --show-error --silent -X POST \
            -H 'content-type: application/json' \
            -H "cookie: stratum_session=$TECH_TOKEN" \
            -d '{"projectId":"30000000-0000-4000-8000-000000000001","assetId":"60000000-0000-4000-8000-000000000001","eventType":"INSTALL","occurredAt":"2026-08-24T23:15:00.000Z","payload":{"assetCode":"STR-UAT-SWGR-001","serialNumber":"SV-UAT-SN-0001","location":"Electrical Room UAT","work":"Installed and torque-checked 480V main switchgear","technician":"Field Technician UAT"}}' \
            https://stratum-verified.vercel.app/api/lifecycle | tee /tmp/event.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/event.json'))
          assert x.get('id'), x
          assert x.get('status') == 'SUBMITTED', x
          print(x['id'])
          PY
      - name: Upload private installation evidence with SHA-256 verification
        run: |
          EVENT_ID=$(python -c "import json;print(json.load(open('/tmp/event.json'))['id'])")
          printf '%s' 'STRATUM Verified production pilot installation evidence | STR-UAT-SWGR-001 | torque checked | 2026-08-24' > /tmp/install-evidence.txt
          SHA=$(sha256sum /tmp/install-evidence.txt | awk '{print $1}')
          curl --fail --show-error --silent -X POST \
            -H "cookie: stratum_session=$TECH_TOKEN" \
            -F "file=@/tmp/install-evidence.txt;type=text/plain" \
            -F "lifecycleEventId=$EVENT_ID" \
            -F 'assetId=60000000-0000-4000-8000-000000000001' \
            -F 'kind=INSTALLATION_REPORT' \
            -F 'visibility=PRIVATE' \
            -F "sha256=$SHA" \
            https://stratum-verified.vercel.app/api/evidence/upload | tee /tmp/evidence.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/evidence.json'))
          assert x.get('fileStored') is True, x
          assert len(x.get('sha256','')) == 64, x
          PY
      - name: Create independent P-256 approval signature
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const e=JSON.parse(fs.readFileSync('/tmp/event.json','utf8'));
          const {privateKey,publicKey}=crypto.generateKeyPairSync('ec',{namedCurve:'P-256'});
          const signature=crypto.sign('sha256',Buffer.from(e.payload_sha256,'utf8'),{key:privateKey,dsaEncoding:'ieee-p1363'}).toString('base64');
          const publicKeyJwk=publicKey.export({format:'jwk'});
          fs.writeFileSync('/tmp/approval.json',JSON.stringify({lifecycleEventId:e.id,decision:'APPROVED',comment:'Independent inspector approval for production business UAT',signature,publicKeyJwk}));
          NODE
      - name: Approve as independent inspector and finalize STRATUM block
        run: |
          curl --fail --show-error --silent -X POST \
            -H 'content-type: application/json' \
            -H "cookie: stratum_session=$INSPECTOR_TOKEN" \
            --data-binary @/tmp/approval.json \
            https://stratum-verified.vercel.app/api/approvals | tee /tmp/approved.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/approved.json'))
          assert x.get('status') == 'VERIFIED', x
          assert int((x.get('receipt') or {}).get('blockHeight',0)) >= 2, x
          assert len(x.get('evidenceHash','')) == 64, x
          print('BLOCK',x['receipt']['blockHeight'],'TX',x['receipt']['txHash'])
          PY
      - name: Verify asset through public STRATUM Verified API
        run: |
          curl --fail --show-error --silent 'https://stratum-verified.vercel.app/api/verify?q=STR-UAT-SWGR-001' | tee /tmp/verify.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/verify.json'))
          assert x.get('verified') is True, x
          r=x.get('records') or []
          assert any(int(z.get('ledger_block_height') or 0)>=2 for z in r), x
          print('PUBLIC VERIFIED',[(z.get('record_id'),z.get('ledger_block_height'),z.get('ledger_tx_hash')) for z in r])
          PY
